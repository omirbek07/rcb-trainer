<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренажер АРРФР: Карточки и Тесты</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <!-- Переключатель режимов -->
  <div class="mode-switch">
    <button class="mode-btn active" id="btnModeCards" onclick="setMode('cards')">🗂️ Карточки (Изучение)</button>
    <button class="mode-btn" id="btnModeQuiz" onclick="setMode('quiz')">📝 Тестирование (Экзамен)</button>
  </div>

  <!-- Фильтры -->
  <div class="filters">
    <div class="filter-item">
      <label>Модуль:</label>
      <select id="moduleSelect" onchange="applyFilters()">
        <option value="all">Все модули</option>
        <option value="rcb" selected>Рынок ценных бумаг (РЦБ)</option>
        <option value="gk">Гражданский кодекс</option>
        <option value="ao">Закон об АО</option>
        <option value="buh">Бухгалтерский учет</option>
      </select>
    </div>
    <div class="filter-item">
      <label>Уровень:</label>
      <select id="levelSelect" onchange="applyFilters()">
        <option value="all">Все уровни</option>
        <option value="1">🟢 Уровень 1 (Определения / База)</option>
        <option value="2">🟡 Уровень 2 (Процедуры / Участники)</option>
        <option value="3">🔴 Уровень 3 (Сроки / Санкции)</option>
      </select>
    </div>
    <!-- Фильтр по статусу изучения -->
    <div class="filter-group">
      <label for="status-filter">Статус:</label>
      <select id="status-filter" onchange="applyFilters()">
        <option value="all">Все вопросы</option>
        <option value="unlearned" selected>Не изучено</option>
        <option value="learned">Изучено</option>
        <option value="mistakes">⚠️ Ошибки (0)</option>
      </select>
    </div>
    <!-- Быстрый переход по номеру -->
    <div class="filter-group goto-group">
      <label for="goto-input">Перейти к №:</label>
      <div class="goto-box">
        <input type="number" id="goto-input" min="1" placeholder="№" />
        <button id="goto-btn" type="button">Go</button>
      </div>
    </div>
  </div>

  <!-- Панель статуса -->
  <div class="status-panel">
    <span id="counterText">Загрузка базы...</span>
    <span id="scoreText">Изучено: 0</span>
  </div>
  <div class="progress-bar-container">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- Секция Карточек -->
  <div class="flashcard-section" id="cardsSection">
    <div class="scene" onclick="flipCard()">
      <div class="card" id="flashcard">
        <div class="card-face card-front">
          <div class="card-top">
            <span class="badge" id="cBadge">Уровень</span>
            <span style="color: var(--text-dim);" id="cNumber">№</span>
          </div>
          <div class="card-content">
            <div class="q-title" id="cQuestion">Загрузка вопроса...</div>
          </div>
          <div class="card-hint">Нажмите, чтобы перевернуть карточку ↻</div>
        </div>

        <div class="card-face card-back">
          <div class="card-top">
            <span style="color: var(--accent); font-weight: 700;">ПРАВИЛЬНЫЙ ОТВЕТ</span>
          </div>
          <div class="card-content">
            <div class="a-title" id="cAnswer">Ответ</div>
          </div>
          <div class="card-hint">Нажмите, чтобы вернуться к вопросу ↺</div>
        </div>
      </div>
    </div>

    <div class="card-actions">
      <button class="btn btn-red" onclick="cardAction(false)">🔴 Повторить позже</button>
      <button class="btn btn-green" onclick="cardAction(true)">🟢 Знаю точно</button>
    </div>
  </div>

  <!-- Секция Тестов -->
  <div class="quiz-section" id="quizSection">
    <div class="quiz-box">
      <div class="card-top">
        <span class="badge" id="qBadge">Уровень</span>
        <span style="color: var(--text-dim);" id="qNumber">Тест №</span>
      </div>
      <div class="quiz-question" id="quizQuestionText">Вопрос теста?</div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="quiz-explanation" id="quizExplanation"></div>
      <button class="quiz-next-btn" id="btnNextQuiz" onclick="nextQuizQuestion()">Следующий вопрос →</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
